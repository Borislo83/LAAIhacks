<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lens Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* Dev-only monitor for the Even Hub simulator (run it with --automation-port 9898).
     Blueprint tokens, as in src/companion.ts. */
  :root {
    color-scheme: dark;
    --sheet: #23272b; --panel: #272b30; --well: #1d2024; --hair: #41484f; --ink: #e8ebe4;
    --muted: #8d949a; --lens: #8ee6a2; --lens-bg: #121417; --warn: #f2a477; --r: 3px;
    --serif: "Instrument Serif", Georgia, serif; --sans: "Instrument Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sheet); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font: 400 36px/1 var(--serif); margin: 0; }
  .state { font: 12px var(--mono); color: var(--muted); }
  .state.live { color: var(--lens); }
  .state.off { color: var(--warn); }
  .lens { background: var(--lens-bg); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px; }
  .lens img { display: block; width: 100%; aspect-ratio: 2 / 1; image-rendering: pixelated; }
  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { min-height: 44px; border: 1px solid var(--hair); border-radius: var(--r); background: transparent;
    color: var(--ink); font: 14px var(--sans); cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 500; }
  button:focus-visible { outline: 2px solid var(--lens); outline-offset: 2px; }
  kbd { font: 11px var(--mono); color: var(--muted); margin-left: 6px; }
  h2 { font: 12px var(--mono); color: var(--muted); margin: 0 0 8px; font-weight: 400; }
  .log { background: var(--well); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px;
    font: 12px/1.6 var(--mono); color: var(--muted); max-height: 260px; overflow-y: auto; margin: 0;
    white-space: pre-wrap; word-break: break-word; }
  .log .error { color: var(--warn); }
  @media (max-width: 560px) { .controls { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lens Monitor</h1>
    <span class="state" id="state" role="status">Connecting to the simulator…</span>
  </header>
  <div class="lens"><img id="lens" alt="Live glasses display from the Even Hub simulator" /></div>
  <div class="controls">
    <button data-action="up">Up <kbd>↑</kbd></button>
    <button data-action="down">Down <kbd>↓</kbd></button>
    <button data-action="click" class="primary">Tap <kbd>Enter</kbd></button>
    <button data-action="double_click">Double-tap <kbd>Esc</kbd></button>
  </div>
  <section>
    <h2>Console (newest last, mic audio hidden)</h2>
    <pre class="log" id="log" aria-live="polite"></pre>
  </section>
</main>
<script type="module">
  const API = '/sim-api'
  const lens = document.getElementById('lens')
  const state = document.getElementById('state')
  const log = document.getElementById('log')
  let lastId = 0
  let url = ''

  function setState(text, kind) { state.textContent = text; state.className = `state ${kind}` }

  async function frame() {
    try {
      const res = await fetch(`${API}/screenshot/glasses`, { cache: 'no-store' })
      if (!res.ok) throw new Error(String(res.status))
      const next = URL.createObjectURL(await res.blob())
      lens.src = next
      if (url) URL.revokeObjectURL(url)
      url = next
      setState(`Live · ${new Date().toLocaleTimeString()}`, 'live')
    } catch {
      setState('Simulator not reachable. Run it with --automation-port 9898.', 'off')
    }
    setTimeout(frame, 400)
  }

  async function consoleTail() {
    try {
      const res = await fetch(`${API}/console?since_id=${lastId}`, { cache: 'no-store' })
      const data = await res.json()
      const entries = Array.isArray(data) ? data : (Object.values(data).find(Array.isArray) ?? [])
      for (const e of entries) {
        lastId = Math.max(lastId, Number(e.id) || 0)
        const message = String(e.message ?? '')
        if (message.includes('audioPcm') || message.includes('Flutter Bridge intercepted')) continue
        const line = document.createElement('div')
        line.textContent = `${e.level ?? 'log'}  ${message.slice(0, 300)}`
        if (e.level === 'error') line.className = 'error'
        log.append(line)
      }
      while (log.childElementCount > 200) log.firstElementChild.remove()
      if (entries.length) log.scrollTop = log.scrollHeight
    } catch { /* the frame loop reports connection state */ }
    setTimeout(consoleTail, 1000)
  }

  async function send(action) {
    await fetch(`${API}/input`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }) }).catch(() => {})
  }

  for (const button of document.querySelectorAll('[data-action]')) {
    button.addEventListener('click', () => send(button.dataset.action))
  }
  const keys = { ArrowUp: 'up', ArrowDown: 'down', Enter: 'click', Escape: 'double_click' }
  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLButtonElement && event.key === 'Enter') return
    const action = keys[event.key]
    if (action) { event.preventDefault(); send(action) }
  })

  frame()
  consoleTail()
</script>
</body>
</html>
