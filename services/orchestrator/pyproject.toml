[project]
name = "laai-orchestrator"
version = "0.1.0"
description = "LAAI backend intelligence, agent dispatch, and Supabase persistence"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.6,<3", "uvicorn>=0.34,<1"]

[project.scripts]
laai-orchestrator = "laai_orchestrator.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
