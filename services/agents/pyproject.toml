[project]
name = "laai-agents"
version = "0.1.0"
description = "Fetch.ai uAgents for LAAI smart glasses: price compare, alternatives, reviews"
readme = "README.md"
authors = [
    { name = "Borislo83", email = "Borislo830@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "uagents>=0.26.1",
    "ddgs>=9,<10",
    "lxml>=6,<7",
    "playwright>=1.50,<2",
    "aiohttp>=3.9,<4",
    "pydantic>=2.5,<3",
]

[project.scripts]
laai-agents = "laai_agents.main:main"
laai-glasses-executor = "laai_agents.integration:main"
laai-g2-sim = "laai_agents.g2_sim:main"
laai-register = "laai_agents.register:main"
laai-spotify-login = "laai_agents.spotify:login"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
